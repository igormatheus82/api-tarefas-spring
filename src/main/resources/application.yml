# Configuração padrão: banco H2 em memória (não precisa instalar nada)
spring:
  application:
    name: api-tarefas-spring
  datasource:
    url: jdbc:h2:mem:tarefas;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:tarefas)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
